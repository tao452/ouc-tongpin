server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/ouc_tongpin?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USER:tongpin}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

privacy:
  anonymous-id-secret: ${ANON_ID_SECRET:}

moderation:
  base-url: ${MODERATION_BASE_URL:http://localhost:8000}

matching:
  base-url: ${MATCH_SCORING_BASE_URL:http://localhost:8000}
  connect-timeout-ms: ${MATCH_CONNECT_TIMEOUT_MS:200}
  read-timeout-ms: ${MATCH_READ_TIMEOUT_MS:500}

jwt:
  secret: ${JWT_SECRET:}
  expire-minutes: ${JWT_EXPIRE_MINUTES:120}

auth:
  wechat:
    app-id: ${WX_APPID:}
    secret: ${WX_SECRET:}
    mock-enabled: ${WX_MOCK_ENABLED:false}
