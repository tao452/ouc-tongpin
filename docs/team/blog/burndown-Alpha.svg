<svg viewBox="0 0 680 380" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title>Alpha 阶段燃尽图（S1，11 个故事）</title>
<desc>理想剩余故事数从 11 线性降至 0；实际线：五初/五末/六初均为 11（地基期），六末因 US-02 关闭降至 10，提交时 US-28/US-34 关闭降至 8</desc>

<text x="340" y="26" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="600" fill="#111827">Alpha 燃尽图（S1，11 个故事）</text>

<!-- 坐标轴 -->
<line x1="90" y1="60" x2="90" y2="300" stroke="#d1d5db" stroke-width="1"/>
<line x1="90" y1="300" x2="620" y2="300" stroke="#d1d5db" stroke-width="1"/>

<!-- Y 轴刻度 -->
<text x="80" y="60" text-anchor="end" dominant-baseline="central" font-size="12" fill="#6b7280">11</text>
<text x="80" y="126" text-anchor="end" dominant-baseline="central" font-size="12" fill="#6b7280">8</text>
<text x="80" y="213" text-anchor="end" dominant-baseline="central" font-size="12" fill="#6b7280">4</text>
<text x="80" y="300" text-anchor="end" dominant-baseline="central" font-size="12" fill="#6b7280">0</text>

<!-- X 轴刻度 -->
<text x="100" y="320" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#6b7280">五初</text>
<text x="230" y="320" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#6b7280">五末</text>
<text x="360" y="320" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#6b7280">六初</text>
<text x="490" y="320" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#6b7280">六末</text>
<text x="620" y="320" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#6b7280">提交时</text>

<!-- 理想线 -->
<polyline points="100,60 620,300" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="360" y="178" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#9ca3af">理想线（11 → 0）</text>

<!-- 实际线 -->
<polyline points="100,60 230,60 360,60 490,82 620,126" fill="none" stroke="#2563eb" stroke-width="2.5"/>
<circle cx="100" cy="60" r="3.5" fill="#2563eb"/>
<circle cx="230" cy="60" r="3.5" fill="#2563eb"/>
<circle cx="360" cy="60" r="3.5" fill="#2563eb"/>
<circle cx="490" cy="82" r="3.5" fill="#2563eb"/>
<circle cx="620" cy="126" r="3.5" fill="#2563eb"/>
<text x="100" y="48" text-anchor="middle" font-size="11" fill="#2563eb">11</text>
<text x="230" y="48" text-anchor="middle" font-size="11" fill="#2563eb">11</text>
<text x="360" y="48" text-anchor="middle" font-size="11" fill="#2563eb">11</text>
<text x="490" y="70" text-anchor="middle" font-size="11" fill="#2563eb">10</text>
<text x="620" y="114" text-anchor="middle" font-size="11" fill="#2563eb">8</text>

<!-- 图例 -->
<line x1="420" y1="350" x2="450" y2="350" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="456" y="350" text-anchor="start" dominant-baseline="central" font-size="11" fill="#6b7280">理想</text>
<line x1="500" y1="350" x2="530" y2="350" stroke="#2563eb" stroke-width="2.5"/>
<text x="536" y="350" text-anchor="start" dominant-baseline="central" font-size="11" fill="#6b7280">实际剩余</text>
</svg>
