<svg viewBox="0 0 680 360" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title>Alpha 阶段燃尽图（S1，11 个故事）</title>
<desc>理想剩余故事数从 11 线性降至 0；实际线在第六周末因 US-02 关闭由 11 降至 10</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="340" y="28" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="600" fill="#111827">Alpha 燃尽图（S1，11 个故事）</text>
<line x1="80" y1="60" x2="80" y2="300" stroke="#d1d5db" stroke-width="1"/>
<line x1="80" y1="300" x2="620" y2="300" stroke="#d1d5db" stroke-width="1"/>
<text x="70" y="60" text-anchor="end" dominant-baseline="central" font-size="12" fill="#6b7280">11</text>
<text x="70" y="181" text-anchor="end" dominant-baseline="central" font-size="12" fill="#6b7280">6</text>
<text x="70" y="300" text-anchor="end" dominant-baseline="central" font-size="12" fill="#6b7280">0</text>
<text x="100" y="320" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#6b7280">五初</text>
<text x="260" y="320" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#6b7280">五末</text>
<text x="420" y="320" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#6b7280">六初</text>
<text x="580" y="320" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#6b7280">六末</text>
<polyline points="100,60 580,300" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="350" y="170" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#6b7280">理想线</text>
<polyline points="100,60 260,60 420,60 580,82" fill="none" stroke="#111827" stroke-width="2"/>
<circle cx="100" cy="60" r="3" fill="#111827"/>
<circle cx="260" cy="60" r="3" fill="#111827"/>
<circle cx="420" cy="60" r="3" fill="#111827"/>
<circle cx="580" cy="82" r="3" fill="#111827"/>
<text x="470" y="48" text-anchor="start" dominant-baseline="central" font-size="12" fill="#374151">实际线（六末 US-02 关闭 → 10）</text>
</svg>
