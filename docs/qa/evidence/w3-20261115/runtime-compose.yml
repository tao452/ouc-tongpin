services:
  mysql:
    image: public.ecr.aws/docker/library/mysql:8.0.44
  redis:
    image: public.ecr.aws/docker/library/redis:7-alpine
  api:
    image: ouc-m6-w3-api:local
  algo:
    image: ouc-m6-w3-algo:local
  web:
    image: public.ecr.aws/docker/library/nginx:stable-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../apps/admin-web/dist:/usr/share/nginx/html:ro
