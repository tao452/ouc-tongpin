name: Deploy test environment

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy and verify temporary test environment
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Generate isolated credentials
        run: python scripts/ci/create-test-env.py
      - name: Build and deploy five services
        id: deployed
        run: |
          docker compose --env-file .env -f infra/docker-compose.yml config -q
          docker compose --env-file .env -f infra/docker-compose.yml up -d --build --wait --wait-timeout 240
      - name: Verify HTTP routes and record catalogue evidence
        run: |
          python scripts/e2e/foundation-smoke.py
          python scripts/qa/execute_stack_cases.py --output qa-private/stack-results.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify the built moderation image with W2 HTTP samples
        run: |
          python -m pip install -r services/algo/requirements.txt
          python services/algo/scripts/evaluate_dataset.py docs/qa/data/w2-moderation-regression.jsonl --base-url http://127.0.0.1:8080 --min-benign 200 --min-blocked 100 --output qa-private/w2-moderation-http.json
          python scripts/qa/verify_treehole_moderation.py --output qa-private/w2-treehole-http.json
          docker compose --env-file .env -f infra/docker-compose.yml images --format json > qa-private/w2-images.json
      - name: Execute existing API and high-priority catalogue regression
        run: python scripts/qa/run_existing_api_regression.py --output qa-private/existing-api-regression.json
      - name: Execute 30 W3 login, check-in and treehole API cases
        run: python scripts/qa/run_w3_api_regression.py --output qa-private/w3-api-regression.json
      - name: Run bounded W3 read-only load demonstration
        run: python scripts/qa/run_w3_load.py --login --output qa-private/w3-load.json
      - name: Verify trusted JWT identities, ownership, database roles and runtime PII
        if: ${{ !cancelled() && steps.deployed.outcome == 'success' }}
        run: python scripts/qa/run_us25_security.py --output qa-private/us25-security.json
      - name: Collect sanitized database initialization diagnostics
        if: failure()
        run: python scripts/qa/collect_mysql_initialization.py
      - uses: actions/cache@v4
        with:
          path: qa-private/cold-test.csv
          key: cold-pinned-${{ hashFiles('docs/qa/data/external/cold-test.v1.json') }}
      - name: Verify deployed dictionary identity and historical external HTTP diagnostic
        continue-on-error: true
        run: |
          docker compose --env-file .env -f infra/docker-compose.yml -f infra/docker-compose.us24-v1.yml up -d --wait --wait-timeout 60 algo
          python scripts/qa/fetch_cold_test.py --output qa-private/cold-test.csv
          python services/algo/scripts/evaluate_external.py qa-private/cold-test.csv --base-url http://127.0.0.1:8080 --output qa-private/us24-external-http.json
      - name: Restore starter dictionary after historical diagnostic
        if: ${{ !cancelled() && steps.deployed.outcome == 'success' }}
        run: docker compose --env-file .env -f infra/docker-compose.yml up -d --wait --wait-timeout 60 algo
      - name: Upload test environment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalogue-stack-evidence
          path: |
            qa-private/stack-results.json
            qa-private/w2-moderation-http.json
            qa-private/w2-treehole-http.json
            qa-private/w2-images.json
            qa-private/existing-api-regression.json
            qa-private/w3-api-regression.json
            qa-private/w3-load.json
            qa-private/us25-security.json
            qa-private/mysql-initialization.json
            qa-private/us24-external-http.json
          if-no-files-found: warn
      - name: Verify opt-in candidate dictionary through the built gateway
        run: |
          docker compose --env-file .env -f infra/docker-compose.yml -f infra/docker-compose.us24-review.yml up -d --wait --wait-timeout 60 algo
          python services/algo/scripts/evaluate_candidate.py docs/qa/data/us24-development.v2.jsonl --base-url http://127.0.0.1:8080 --output qa-private/us24-candidate-http.json
      - name: Upload candidate HTTP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us24-candidate-http-evidence
          path: qa-private/us24-candidate-http.json
          if-no-files-found: warn
      - name: Verify v3 recall candidate through the built gateway
        run: |
          docker compose --env-file .env -f infra/docker-compose.yml -f infra/docker-compose.us24-recall.yml up -d --wait --wait-timeout 60 algo
          python services/algo/scripts/evaluate_recall.py docs/qa/data/us24-development.v3.jsonl --base-url http://127.0.0.1:8080 --output qa-private/us24-v3-http.json
      - name: Upload v3 HTTP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us24-v3-http-evidence
          path: qa-private/us24-v3-http.json
          if-no-files-found: warn
      - name: Verify v3.1 local context exemptions through the built gateway
        run: |
          docker compose --env-file .env -f infra/docker-compose.yml -f infra/docker-compose.us24-context.yml up -d --wait --wait-timeout 60 algo
          python scripts/qa/verify_context_candidate.py --base-url http://127.0.0.1:8080 --output qa-private/us24-v3_1-http.json
      - name: Upload v3.1 context HTTP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us24-v3_1-context-http-evidence
          path: qa-private/us24-v3_1-http.json
          if-no-files-found: warn
      - name: Verify bounded numeric tones and context through the built gateway
        run: |
          docker compose --env-file .env -f infra/docker-compose.yml -f infra/docker-compose.us24-pronunciation.yml up -d --wait --wait-timeout 60 algo
          python services/algo/scripts/evaluate_variant.py docs/qa/data/us24-development.v3_3.jsonl --dictionary services/algo/app/data/moderation-v3_3-candidate.json --base-url http://127.0.0.1:8080 --output qa-private/us24-v3_3-http.json
      - name: Upload numeric tone HTTP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us24-v3_3-numeric-tone-http-evidence
          path: qa-private/us24-v3_3-http.json
          if-no-files-found: warn
      - name: Show service state on failure
        if: failure()
        run: docker compose --env-file .env -f infra/docker-compose.yml ps -a
      - name: Remove temporary environment
        if: always()
        run: docker compose --env-file .env -f infra/docker-compose.yml down -v
