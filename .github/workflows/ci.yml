name: CI

permissions:
  contents: read
  pull-requests: read

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 常驻检查：无论改了哪些目录都会跑，保证分支保护里永远有一条可勾、且一定会出结果的检查。
  # 保护规则里 "Require status checks" 的候选项来自最近 7 天实际运行过的 job，
  # 如果只留下面那几个按目录条件触发的 job，改 README 的 PR 一条检查都不会有。
  guard:
    name: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 拦截敏感文件入库
        run: |
          hits=$(git ls-files | grep -E '(^|/)\.env$|\.pem$|\.key$|\.p12$|project\.private\.config\.json$' || true)
          if [ -n "$hits" ]; then
            echo "::error::以下文件不应入库，请删除后重新提交："
            echo "$hits"
            exit 1
          fi
          echo "敏感文件检查通过"

      - name: 拦截超大文件（>5MB）
        run: |
          found=0
          while IFS= read -r -d '' f; do
            [ -f "$f" ] || continue
            sz=$(wc -c < "$f")
            if [ "$sz" -gt 5242880 ]; then
              echo "::error file=$f::体积 $((sz/1024/1024))MB，超过 5MB 上限，请改用共享盘或 Git LFS"
              found=1
            fi
          done < <(git ls-files -z)
          if [ "$found" -ne 0 ]; then exit 1; fi
          echo "文件体积检查通过"

      - name: 提交信息必须符合规范
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git fetch -q origin "$BASE"
          bad=$(git log --format=%s --no-merges "origin/$BASE..HEAD" | grep -vE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^)]+\))?!?: .+' || true)
          if [ -n "$bad" ]; then
            echo "::error::以下提交信息不符合「<类型>(<范围>): <描述>」规范："
            echo "$bad"
            echo "允许的类型：feat fix docs style refactor perf test build ci chore revert"
            exit 1
          fi
          echo "提交信息检查通过"

      - name: 提醒 PR 关联 Issue（不阻断）
        if: github.event_name == 'pull_request'
        env:
          BODY: ${{ github.event.pull_request.body }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s' "$BODY" | grep -qiE '(closes|fixes|resolves|refs) +#[0-9]+'; then
            echo "::warning::PR 描述缺少 Issue 引用。共享/未完成任务用 Refs #编号，整体验收后再关闭。"
          fi

  changes:
    runs-on: ubuntu-latest
    outputs:
      mp: ${{ steps.filter.outputs.mp }}
      admin: ${{ steps.filter.outputs.admin }}
      api: ${{ steps.filter.outputs.api }}
      algo: ${{ steps.filter.outputs.algo }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            mp:
              - 'apps/miniprogram/**'
              - '.github/workflows/ci.yml'
            admin:
              - 'apps/admin-web/**'
              - '.github/workflows/ci.yml'
            api:
              - 'services/api-server/**'
            algo:
              - 'services/algo/**'
              - 'packages/contract/**'
              - 'scripts/qa/**'
              - 'scripts/w1/**'
              - 'scripts/release/**'
              - 'docs/qa/s1-test-cases.json'
              - '.github/workflows/**'

  miniprogram:
    needs: changes
    if: needs.changes.outputs.mp == 'true'
    runs-on: ubuntu-latest
    env:
      HUSKY: '0'
    defaults:
      run:
        working-directory: apps/miniprogram
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/miniprogram/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run check:project

  admin-web:
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/admin-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test -- --run
      - run: npm run build

  api-server:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B -q verify

  algo:
    needs: changes
    if: needs.changes.outputs.algo == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/algo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests scripts ../../scripts/qa ../../scripts/w1 ../../scripts/release
      - run: pytest -q

  stack:
    uses: ./.github/workflows/deploy-test.yml

  w1-poc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r services/algo/requirements.txt
      - run: python scripts/w1/run_poc.py --output qa-private/w1-poc.json
      - uses: actions/upload-artifact@v4
        with:
          name: w1-poc-evidence
          path: qa-private/w1-poc.json

  quality:
    if: always()
    needs: [guard, changes, miniprogram, admin-web, api-server, algo, stack, w1-poc]
    runs-on: ubuntu-latest
    steps:
      - name: Require all selected checks to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          outputs = results['changes'].get('outputs', {})
          modules = {'mp': 'miniprogram', 'admin': 'admin-web', 'api': 'api-server', 'algo': 'algo'}
          if any(outputs.get(key) not in ('true', 'false') for key in modules):
              raise SystemExit('Missing or invalid change-filter output')
          required = {'guard', 'changes', 'stack', 'w1-poc'}
          required.update(job for key, job in modules.items() if outputs[key] == 'true')
          failed = [name for name, job in results.items()
                    if job['result'] not in ('success', 'skipped')
                    or (name in required and job['result'] != 'success')]
          failed.extend(sorted(required - results.keys()))
          if failed:
              raise SystemExit('Failed checks: ' + ', '.join(failed))
          PY
