name: Nightly regression

on:
  schedule:
    - cron: '0 18 * * *'  # 02:00 Asia/Shanghai; starts only after merge to the default branch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  algo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/algo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests scripts ../../scripts/qa ../../scripts/w1 ../../scripts/release
      - run: pytest -q
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B -q -f services/api-server/pom.xml verify
