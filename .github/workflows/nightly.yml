name: Nightly regression

on:
  schedule:
    - cron: '0 18 * * *'  # 02:00 Asia/Shanghai; starts only after merge to the default branch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  algo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/algo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests scripts ../../scripts/qa ../../scripts/w1 ../../scripts/release
      - run: pytest -q --junitxml=pytest-junit.xml
      - name: W2 content safety regression gate
        run: >-
          python scripts/evaluate_dataset.py ../../docs/qa/data/w2-moderation-regression.jsonl
          --min-benign 200 --min-blocked 100
          --output ../../qa-private/w2-moderation-function.json
      - name: Verify synthetic PII baseline
        run: python ../../scripts/qa/run_pii_baseline.py --output ../../qa-private/pii-baseline.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-pii-baseline-evidence
          path: qa-private/pii-baseline.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-algo-test-evidence
          path: |
            services/algo/coverage.xml
            services/algo/pytest-junit.xml
            qa-private/w2-moderation-function.json
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B -q -f services/api-server/pom.xml verify
